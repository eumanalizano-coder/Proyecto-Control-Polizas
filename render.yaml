# render.yaml
# Blueprint de Render: describe el servicio web para desplegar la app.
services:
  - type: web
    name: control-polizas
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-dev gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: UV_VERSION
        value: 0.13.7
